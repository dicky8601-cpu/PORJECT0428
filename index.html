<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單查詢系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen py-12 px-4">
    <div class="max-w-4xl mx-auto">
        <!-- 查詢區域 -->
        <div class="glass-card rounded-2xl shadow-xl p-8 mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">訂單資料查詢</h1>
            
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="relative flex-grow">
                    <input 
                        type="text" 
                        id="nameInput" 
                        placeholder="請輸入正確的查詢姓名..." 
                        class="w-full px-5 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-lg"
                    >
                </div>
                <button 
                    onclick="handleQuery()" 
                    id="submitBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg active:transform active:scale-95 flex items-center justify-center min-w-[120px]"
                >
                    <span id="btnText">查詢</span>
                    <svg id="loadingSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
            
            <!-- 狀態提示區域 -->
            <div id="statusContainer" class="mt-6 p-4 rounded-xl hidden">
                <p id="statusMsg" class="text-sm font-medium"></p>
                <div id="debugInfo" class="hidden mt-2 p-3 bg-white/50 rounded text-xs font-mono break-all text-gray-600 border border-gray-200">
                    <!-- 顯示 Debug 資訊 -->
                </div>
            </div>
        </div>

        <!-- 結果顯示區域 -->
        <div id="resultContainer" class="hidden glass-card rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-gray-50 px-8 py-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-700">查詢結果</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-4 px-6 font-bold">訂單編號</th>
                            <th class="py-4 px-6 font-bold">會員 ID</th>
                            <th class="py-4 px-6 font-bold">會員姓名</th>
                            <th class="py-4 px-6 font-bold">購買商品</th>
                            <th class="py-4 px-6 font-bold">購買金額</th>
                            <th class="py-4 px-6 font-bold">交易時間</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="text-gray-700 text-sm">
                        <!-- 資料由 JS 動態插入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://6oucrthj.roamerhost.com/webhook-test/98c8e970-4c4e-4029-b7a8-af7348ef3a60';

        async function handleQuery() {
            const nameInput = document.getElementById('nameInput');
            const resultContainer = document.getElementById('resultContainer');
            const resultTableBody = document.getElementById('resultTableBody');
            const statusContainer = document.getElementById('statusContainer');
            const statusMsg = document.getElementById('statusMsg');
            const debugInfo = document.getElementById('debugInfo');

            const queryName = nameInput.value.trim();

            if (!queryName) {
                showStatus('請輸入要查詢的姓名', 'error');
                return;
            }

            setLoading(true);
            statusContainer.classList.add('hidden');
            resultContainer.classList.add('hidden');
            debugInfo.classList.add('hidden');

            try {
                // 發送 JSON 格式資料
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ "查詢姓名": queryName })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`伺服器錯誤 (${response.status}): ${errorText}`);
                }

                const text = await response.text();
                if (!text || text.trim() === "") {
                    showStatus('查詢完成，但伺服器回傳空內容。請確認 n8n 的 Respond to Webhook 節點設定。', 'warning');
                    return;
                }

                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error("JSON Parse Error:", text);
                    throw new Error('伺服器回傳格式非 JSON，請檢查 n8n 的輸出設定。');
                }
                
                // 判斷回傳是否為陣列或單一物件
                const result = Array.isArray(data) ? data[0] : data;

                if (!result || Object.keys(result).length === 0) {
                    showStatus('查無資料。', 'warning');
                } else {
                    displayResult(result);
                    showStatus('查詢成功！', 'success');
                }

            } catch (error) {
                console.error('Fetch Error:', error);
                showStatus(`連線錯誤: ${error.message}`, 'error');
                
                // 針對 n8n 常見錯誤顯示 Debug 提示
                debugInfo.textContent = `建議：請確認 n8n 的「Get row(s)」節點中，篩選條件是否正確讀取了 {{$json["查詢姓名"]}}。`;
                debugInfo.classList.remove('hidden');
            } finally {
                setLoading(false);
            }
        }

        function displayResult(item) {
            const resultContainer = document.getElementById('resultContainer');
            const resultTableBody = document.getElementById('resultTableBody');
            resultTableBody.innerHTML = '';

            const row = document.createElement('tr');
            row.className = 'border-b border-gray-200 hover:bg-gray-50 transition-colors';
            
            const fields = [
                item["訂單編號"] || '-',
                item["會員 ID"] || '-',
                item["會員姓名"] || '-',
                item["購買商品"] || '-',
                item["購買金額"] !== undefined ? `$${item["購買金額"]}` : '-',
                item["交易時間"] || '-'
            ];

            fields.forEach(text => {
                const td = document.createElement('td');
                td.className = 'py-4 px-6 whitespace-nowrap';
                td.textContent = text;
                row.appendChild(td);
            });

            resultTableBody.appendChild(row);
            resultContainer.classList.remove('hidden');
        }

        function setLoading(isLoading) {
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');
            const nameInput = document.getElementById('nameInput');

            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70');
                btnText.textContent = '處理中';
                spinner.classList.remove('hidden');
                nameInput.disabled = true;
            } else {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');
                btnText.textContent = '查詢';
                spinner.classList.add('hidden');
                nameInput.disabled = false;
            }
        }

        function showStatus(text, type) {
            const statusContainer = document.getElementById('statusContainer');
            const statusMsg = document.getElementById('statusMsg');
            
            statusContainer.classList.remove('hidden', 'bg-red-100', 'bg-green-100', 'bg-yellow-100');
            statusMsg.classList.remove('text-red-700', 'text-green-700', 'text-yellow-700');
            
            statusMsg.textContent = text;
            
            if (type === 'error') {
                statusContainer.classList.add('bg-red-100');
                statusMsg.classList.add('text-red-700');
            } else if (type === 'success') {
                statusContainer.classList.add('bg-green-100');
                statusMsg.classList.add('text-green-700');
            } else {
                statusContainer.classList.add('bg-yellow-100');
                statusMsg.classList.add('text-yellow-700');
            }
        }

        document.getElementById('nameInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleQuery();
        });
    </script>
</body>
</html>
